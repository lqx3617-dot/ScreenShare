# Project-wide Gradle settings.
android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# ==================== TURN 服务器配置 ====================
# 异地共享依赖 TURN 中继（严格 NAT 场景）。
# 当前使用环境内自建 coturn 服务器（TURN over TCP，UDP 中继在代理环境下不可靠）
screenshare.turn.urls=turn:6d639d2de20eb686.monkeycode-ai.online:3478?transport=tcp
screenshare.turn.username=screenshare
screenshare.turn.password=screenshare123

# 口令共享模式下的信令服务器地址（WebSocket）
# 生产环境建议使用 wss（加密），本地调试可填局域网 IP，如 ws://192.168.1.100:8080/ws
screenshare.signal.url=wss://8095-6d639d2de20eb686.monkeycode-ai.online/ws

# 云更新：版本检查接口（返回最新 versionCode/下载地址）
screenshare.update.url=https://8090-6d639d2de20eb686.monkeycode-ai.online/version.json

# 相册上传查看：照片服务器地址（上传接口 + 相册网页托管）
screenshare.album.url=https://8096-6d639d2de20eb686.monkeycode-ai.online

# App 内云发布：下载服务器地址（发布接口 + APK/版本信息托管）
screenshare.download.url=https://8090-6d639d2de20eb686.monkeycode-ai.online

