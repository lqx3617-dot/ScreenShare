name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download WebRTC AAR
        run: |
          mkdir -p app/libs
          echo "Downloading WebRTC AAR..."
          curl -sL -o app/libs/webrtc.aar \
            "https://github.com/nicedev0908/libwebrtc/releases/download/121.6167.0/libwebrtc-121.6167.0.aar" \
            || curl -sL -o app/libs/webrtc.aar \
            "https://jcenter.bintray.com/org/webrtc/google-webrtc/1.0.32006/google-webrtc-1.0.32006.aar" \
            || true
          ls -la app/libs/webrtc.aar
          file app/libs/webrtc.aar
          # Check file size - if too small it's probably an error page
          SIZE=$(stat -f%z app/libs/webrtc.aar 2>/dev/null || stat -c%s app/libs/webrtc.aar 2>/dev/null || echo 0)
          echo "File size: $SIZE bytes"
          if [ "$SIZE" -lt 10000 ]; then
            echo "WARNING: AAR file too small ($SIZE bytes), likely not a real AAR"
            echo "Trying alternative: Google Maven direct"
            curl -sL -o app/libs/webrtc.aar \
              "https://dl.google.com/dl/android/maven2/org/webrtc/google-webrtc/1.0.32006/google-webrtc-1.0.32006.aar" \
              || true
            SIZE2=$(stat -c%s app/libs/webrtc.aar 2>/dev/null || echo 0)
            echo "File size after retry: $SIZE2 bytes"
          fi

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          JAVA_OPTS: '-Xmx2g'
          GRADLE_OPTS: '-Dorg.gradle.daemon=false'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenShare-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 5
          if-no-files-found: error
